<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — Wizker{% else %}Wizker{% endif %}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  {% seo %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F7F4EE;
      --dark: #1A1714;
      --gold: #B8935A;
      --gold-light: #D4B483;
      --mid: #5C5046;
      --border: rgba(90,72,54,0.15);
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--cream);
      color: var(--dark);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.25rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(247,244,238,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 0.5px solid var(--border);
    }
    .nav-logo img { height: 32px; width: auto; display: block; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }
    .nav-cta {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dark);
      border: 0.5px solid var(--gold);
      padding: 0.55rem 1.4rem;
      text-decoration: none;
      transition: background 0.25s, color 0.25s;
    }
    .nav-cta:hover { background: var(--gold); color: var(--cream); }
    footer {
      padding: 2.5rem 8rem;
      border-top: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6rem;
    }
    .footer-links { display: flex; gap: 2rem; list-style: none; }
    .footer-links a {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--gold); }
    .footer-copy { font-size: 0.68rem; color: #B0A898; }
    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      footer { flex-direction: column; gap: 1.5rem; padding: 2rem; text-align: center; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo"><img src="/WIZKER_WORD_LOGO_BLACK.png" alt="Wizker" /></a>
    <ul class="nav-links">
      <li><a href="/#how-it-works">How It Works</a></li>
      <li><a href="/#product">The Brush</a></li>
      <li><a href="/#story">Our Story</a></li>
      <li><a href="/blog" class="{% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
    </ul>
    <a href="https://www.amazon.com/wizker" target="_blank" class="nav-cta">Shop Now</a>
  </nav>

  <main style="padding-top: 70px;">
    {{ content }}
  </main>

  <footer>
    <a href="/"><img src="/WIZKER_WORD_LOGO_BLACK.png" alt="Wizker" style="height:24px;width:auto;" /></a>
    <ul class="footer-links">
      <li><a href="/#how-it-works">How It Works</a></li>
      <li><a href="/#product">The Brush</a></li>
      <li><a href="/#story">Our Story</a></li>
      <li><a href="/blog">Blog</a></li>
      <li><a href="https://www.amazon.com/wizker" target="_blank">Shop</a></li>
    </ul>
    <p class="footer-copy">&copy; 2025 Wizker. All rights reserved.</p>
  </footer>
</body>
</html>
